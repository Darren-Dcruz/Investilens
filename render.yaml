services:
  - type: web
    name: investilens
    env: node
    plan: free
    buildCommand: npm install --include=dev && cd investilens-ui && npm install --include=dev && npm run build && cd ..
    startCommand: node node_modules/tsx/dist/cli.mjs src/server.ts
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3008
      - key: AI_API_KEY
        sync: false
